  <circle cx="1148" cy="126" r="5" fill="#59f0b5" filter="url(#blur)"/>
  <text x="86" y="92" fill="#3be7ff" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">HTTP SECURITY HEADERS LAB</text>
  <text x="82" y="205" fill="#f4f7ff" font-family="Georgia, serif" font-size="88" letter-spacing="-4">Header<tspan fill="url(#neon)">Guard</tspan></text>
