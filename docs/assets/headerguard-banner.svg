<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">HeaderGuard by abyssnx</title>
  <desc id="desc">Banner azul abisal, cian y violeta para el analizador de cabeceras HTTP de seguridad.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03050d"/><stop offset=".52" stop-color="#091127"/><stop offset="1" stop-color="#130d2b"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3be7ff"/><stop offset="1" stop-color="#a981ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#3be7ff" stop-opacity=".28"/><stop offset="1" stop-color="#3be7ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0v42" fill="none" stroke="#8da9da" stroke-opacity=".09"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
